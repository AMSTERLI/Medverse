experiment: pan_cancer_two_model_main
source_manifest: data/manifests/kits23_lits_mswal_tumor_v1.jsonl
fixed_liver_kidney_manifest: work/manifests/kits23_lits_mswal_liver_kidney_fixed.jsonl
roi_manifest: work/data/kits23_lits_mswal_liver_kidney_v1/manifests/roi_manifest.jsonl
scope:
  datasets: [LiTS, KiTS23, MSWAL]
  tasks: [liver_tumor, kidney_tumor]
split:
  method: fixed_manifest_split
  group_key: source_dataset_and_patient_id
  ratios: [0.70, 0.10, 0.20]
  seed: 20260831
roi:
  source: frozen_offline_TotalSegmentator_total
  roi_subset: [liver, kidney_left, kidney_right]
  margin_mm: 30
  orientation: RAS
  resample_during_crop: false
  spacing_policy: nnunetv2_fingerprint_and_planner
  planner_snapshot: work/experiments/nnunet_plan_snapshot.json
  hu_window: [-1000, 1000]
labels:
  background: 0
  tumor: 1
  mappings:
    curated_binary_tumor_masks: [1]
  kits23_cyst_label_excluded: 3
input_channels:
  0: CT
  1: TotalSegmentator_organ_mask
rules:
  identical_cases_between_models: true
  identical_roi_planner_spacing_labels_and_test: true
  five_fold_enabled: false
